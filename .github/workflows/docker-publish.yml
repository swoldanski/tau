name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  versioned:
    name: Publish tagged image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Derive version from tag
        run: echo "TAU_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/tau:${{ env.TAU_VERSION }}
            ghcr.io/${{ github.repository_owner }}/tau:latest
          build-args: |
            TAU_SOURCE=pypi
            TAU_VERSION=${{ env.TAU_VERSION }}
          cache-from: type=gha,scope=tau-publish
          cache-to: type=gha,scope=tau-publish,mode=max

  latest:
    name: Publish main image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Derive version from pyproject
        run: |
          TAU_VERSION="$(grep -m1 '^version' pyproject.toml | sed -E 's/^version = "(.*)"/\1/')"
          echo "TAU_VERSION=${TAU_VERSION}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/tau:latest
          build-args: |
            TAU_SOURCE=pypi
            TAU_VERSION=${{ env.TAU_VERSION }}
          cache-from: type=gha,scope=tau-publish
          cache-to: type=gha,scope=tau-publish,mode=max
